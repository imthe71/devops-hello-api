name: CI and Production deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/devops-hello-api-private

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test API
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          PYTHONPATH=. pytest -q

  publish-production:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.revision.outputs.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.revision.outputs.sha }}

  update-production-image-tag:
    needs: publish-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/devops-hello-api-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops
      - name: Update production Helm image tag
        env:
          IMAGE_TAG: ${{ needs.publish-production.outputs.image_tag }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("gitops/chart/values.yaml")
          content = path.read_text(encoding="utf-8")
          updated = re.sub(r'(?m)^(  tag: ")[^"]+("$)', rf'\g<1>{os.environ["IMAGE_TAG"]}\g<2>', content, count=1)
          if updated == content:
              raise SystemExit("image.tag was not updated")
          path.write_text(updated, encoding="utf-8")
          PY
      - name: Commit and push production GitOps change
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart/values.yaml
          git commit -m "chore: deploy production image ${{ needs.publish-production.outputs.image_tag }}"
          git push
