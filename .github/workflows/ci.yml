name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/devops-hello-api

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test API
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  update-gitops-image-tag:
    needs: build-test-publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/devops-hello-api-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Update Helm image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("gitops/chart/values.yaml")
          content = path.read_text(encoding="utf-8")
          updated = re.sub(
              r'(?m)^(  tag: ")[^"]+("$)',
              rf'\g<1>{os.environ["IMAGE_TAG"]}\g<2>',
              content,
              count=1,
          )
          if updated == content:
              raise SystemExit("image.tag was not updated")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit and push GitOps change
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart/values.yaml
          git commit -m "chore: deploy image ${{ github.sha }}"
          git push
