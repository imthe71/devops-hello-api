name: Deploy selected revision to UAT

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Feature branch, tag, or commit SHA to validate in UAT
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/devops-hello-api

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test API
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          PYTHONPATH=. pytest -q
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push UAT image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.revision.outputs.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.revision.outputs.sha }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/devops-hello-api-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops
      - name: Update UAT Helm image tag
        env:
          IMAGE_TAG: ${{ steps.revision.outputs.sha }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("gitops/chart/values-uat.yaml")
          content = path.read_text(encoding="utf-8")
          updated = re.sub(r'(?m)^(  tag: ")[^"]+("$)', rf'\g<1>{os.environ["IMAGE_TAG"]}\g<2>', content, count=1)
          if updated != content:
              path.write_text(updated, encoding="utf-8")
          else:
              print("UAT already uses this image tag")
          PY
      - name: Commit and push UAT GitOps change
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart/values-uat.yaml
          if git diff --cached --quiet; then
            echo "UAT already uses this image tag"
            exit 0
          fi
          git commit -m "chore: deploy UAT image ${{ steps.revision.outputs.sha }}"
          git push
